<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZentroConnect</title>
  {% load static %}
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
  <link rel="stylesheet" href="{% static '/style/createpoststyle.css' %}">
  <link rel="stylesheet" href="{% static '/style/navbar.css' %}">
  <link rel="stylesheet" href="{% static '/style/post.css' %}">
  <link rel="stylesheet" href="{% static '/style/theme.css' %}">
</head>

<body>
  <div id="overlay"></div>


  <!-- NAVBAR -->
  <div class="navbar">
    <div class="navbar-balancer"></div>
    <div class="logo">ZentroConnect</div>
    <div class="settings-btn" id="settingsBtn">⚙

    </div>
    <div class="settings-dropdown" id="settingsMenu">
      <div class="settings-header">
        <span>Settings</span>
        <button class="close-btn" id="closeBtn">✕</button>
      </div>
      <div class="setting-item">

        <span>Theme</span>

        <label class="switch">
          <input type="checkbox" id="themeToggle">
          <span class="slider"></span>
        </label>

      </div>

      <div class="menu-item" id="profileUpdatebtn">
        Edit Profile
      </div>

      <div class="menu-item">
        About
      </div>


    </div>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <a href="/home">
      <div class="side-item">🏠 <span class="side-text">Home</span></div>
    </a>
    <a href="/search">
      <div class="side-item">🔍 <span class="side-text">Search</span></div>
    </a>
    <a href="#">
      <div class="side-item" id="openPostModal">➕ <span class="side-text">Create</span></div>
    </a>
    <a href="/profile">
      <div class="side-item">👤 <span class="side-text">Profile</span></div>
    </a>
  </div>

  <div class="bottom-nav-mobile">
    <a href="/home">🏠</a>
    <a href="/search">🔍</a>
    <a href="#" id="openPostModalMobile">➕</a>
    <a href="/profile">👤</a>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main">
    <div class="feed-container" id="feed">



    </div>
  </div>

  <script src="{% static '/script/loadRefreshToken.js' %}"></script>
  <script src="{% static '/script/likePost.js' %}"></script>
  <script src="{% static '/script/loadfeed.js' %}"></script>
  <script src="{% static '/script/commentPost.js' %}"></script>
  <script src="{% static '/script/removeOverlay.js' %}"></script>
  <script>
    

    const resultcontainer = document.getElementById('feed')

    resultcontainer.addEventListener('click', (event) => {
      const post = event.target.closest('.post')

      if (event.target.classList.contains('like-btn')) {
        likepost(post)
      }

      if (event.target.classList.contains('comment-btn')) {
        const inputtext = post.querySelector('.comment-text')

        commentPost(inputtext.value, post.id)


      }
    })

  </script>
  <script src="{% static '/script/createpost.js' %}"></script>
  <script src="{% static '/script/navsettings.js' %}"></script>
</body>

</html>
