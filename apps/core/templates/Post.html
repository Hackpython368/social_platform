  <style>
    

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: var(--bg-color);
      color: var(--text-color);
    }



    /* ================= SIDEBAR ================= */
    .sidebar {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 70px;
      background:var(--navbar-color);
      border-radius: 0px 16px 16px 0px;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: 0.3s ease;
      justify-content: center;
    }

    .sidebar:hover {
      display: flex;
      height: 650px;
      width: 200px;
      border-radius: 0px 16px 16px 0px;
      transition: ease .4s;

    }

    .sidebar a {
      width: 100%;
    }

    .side-item {
      width: 100%;
      padding: 20px;
      cursor: pointer;
      color: var(--text-color);
      transition: 0.2s;
    }

    .side-item:hover {
      background: var(--post-bg);
      color:var(--button-color);
    }

    .side-text {
      display: none;
      opacity: 0;
      transition: 0.9s;
      white-space: nowrap;
    }

    .sidebar:hover .side-text {
      display: inline-block;
      opacity: 1;
      transition: ease .4s;
    }

    a {
      text-decoration: none;
      color: var(--button-text);
    }

    /* ================= MAIN CONTAINER ================= */
    .main {
      margin-top: 90px;
      display: flex;
      justify-content: center;
    }

    .feed-container {
      width: 650px;
    }

    /* ================= POST CARD ================= */
    .post {
      background: var(--card-color);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 6px 20px var(--sidebar-color);
    }

    .post-header {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: var(--border-color);
      margin-right: 12px;
      background-size: cover;
      padding: 10px;
    }

    #profile-pic {
      height: 100%;
      width: 100%;
      border-radius: 50px;
    }

    .user-info h4 {
      font-size: 15px;
      font-weight: 600;
    }

    .user-info span {
      font-size: 12px;
      color: var(--secondary-text);
    }

    .post-content {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-color);
      margin-bottom: 12px;
    }

    .post img {
      width: 100%;
      border-radius: 14px;
      margin-bottom: 12px;
    }

    .actions {
      display: flex;
      gap: 25px;
      padding: 10px 0;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 12px;
    }

    .actions span {
      cursor: pointer;
      color: var(--secondary-text);
      transition: 0.2s;
    }

    .actions span:hover {
      color: var(--button-color);
    }

    .comment-preview {
      font-size: 13px;
      color: var(--secondary-text);
    }



.theme{
  display: flex;
  justify-content: space-around;
  align-items: center;
  text-align: center;
  font-size: 16px;
}


.theme-slider {
    display: inline-block;
    height: 22px;
    position: relative;
    width: 40px;
}

.theme-slider input {
    display: none;
}



.slider {
    background-color: var(--text-color);
    bottom: 0;
    cursor: pointer;
    left: 0;
    position: absolute;
    right: 0;
    top: 0;
}

.slider:before {
    background-color:var(--button-text);
    bottom: 3px;
    content: "";
    height: 16px;
    left: 4px;
    position: absolute;
    transition: .4s;
    width: 16px;
    
}

input:checked+.slider {
    background-color: #66bb6a;
}

input:checked+.slider:before {
    transform: translateX(16px);
}

.slider.round {
    border-radius: 34px;
}

.slider.round:before {
    border-radius: 50%;
}

.hidden{
  display: none;
}

.comment-txt{
  display: flex;
  gap: 5px;
  width: 100%;
  height: 40px;
}

.comment-txt input{
  width: 100%;
  height: 100%;
  font-size: 16px;
  border-radius: 10px;
  padding: 5px;
  background-color: var(--bg-color);
}

.comment-txt button{
  padding: 10px;
  color: var(--text-color);
  border-radius: 20px;
  background-color: var(--button-color);
}

.bottom-nav-mobile{
  padding: 30px;
  position: fixed;
  bottom: 0;
  width: 100%;
  height: 30px;
  background-color: var(--navbar-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
  visibility: hidden;
}

  <script>
    
    const loadfeed = () => {
      fetch('http://127.0.0.1:8000/api/accounts/user/feed/', {
        method: "GET",
        headers: {
          "Authorization": "Bearer " + localStorage.getItem("access")
        }
      }).then(res => res.json()).then(data => {
        console.log(data);
        if (data.code == "token_not_valid") {
          console.log(localStorage.getItem('refresh'));
          fetch("http://127.0.0.1:8000/api/token/refresh/", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ refresh: localStorage.getItem('refresh') })
          }).then(res => res.json()).then(data => {
            console.log(data)
            localStorage.setItem('access', data.data.access)
            loadfeed();
            
          })
        } else {
          document.getElementById("feed").innerHTML = ""
          for (let i = 0; data.data.length > i; i++) {
            
            document.getElementById("feed").innerHTML += `
            <div class="post" id="${data['data'][i]['id']}">
              <div class="post-header">
                ${data['data'][i]['profile_pic']==null ? `<div class="avatar" ><i class="fa-solid fa-user" style="font-size: 20px;"></i></div>`: `<div class="avatar" style="background-image: url(${data['data'][i]['profile_pic']}); background-size: cover;"></div>`}
                <!-- <div class="avatar" style="background-image: url(${data['data'][i]['profile_pic']})"></div> -->
                <div class="user-info">
                  <h4>${data['data'][i]['username']}</h4>
                  <span>12:30 pm · 2 Jan 2026</span>
                </div>
              </div>
              
              <div class="post-content">
                <p>${data['data'][i]['content'].replace('\n','<br><br>')}</p>
              </div>
              ${data['data'][i]['post_img'] == null ? "" : `<img src="${data['data'][i]['post_img']}">`}
              
              
              <div id="rect-container" class="actions">
                <span class="like-btn">${ data['data'][i]['liked']==true ? `<i style="color:red" class="fa-solid fa-heart"></i>`: `<i class="fa-solid fa-heart"></i>`} ${data['data'][i]['like_count']}</span>
                <span id="comment">💬 ${data['data'][i]['comment_count']} Comment</span>
              </div>
              <div class="comment-txt"><input class="comment-text" type="text" placeholder="Comment...."><button class="comment-btn">Comment</button></div>
              
              <div class="comment-preview">
                ${ data['data'][i]['latest_comment']==null ? `` : `<strong>${data['data'][i]['latest_comment']['username']}</strong> ${data['data'][i]['latest_comment']['comment_text']}`}
              </div>
              
            </div>`
          }
        }

      })
    }
    
    loadfeed()
    
    const resultcontainer = document.getElementById('feed')
    
    resultcontainer.addEventListener('click', (event) => {
      const post = event.target.closest('.post')
      console.log(event.target)
      
      if (event.target.classList.contains('like-btn')) {
        
        const likepost = () => {
          console.log("post Liked")
          fetch(`http://127.0.0.1:8000/api/accounts/user/${post.id}/post/like/`, {
            method: "POST",
            headers: {
              "Authorization": "Bearer " + localStorage.getItem("access")
            }
          }).then(res => res.json()).then(data => {
            if (data.code == "token_not_valid") {
              console.log(localStorage.getItem('refresh'));
              fetch("http://127.0.0.1:8000/api/token/refresh/", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({ refresh: localStorage.getItem('refresh') })
              }).then(res => res.json()).then(data => {
                localStorage.setItem('access', data.data.access)
                likepost()
                
              })
              
            } else {
              loadfeed()
            }
          })
        }
        likepost()
      }
      
      if(event.target.classList.contains('comment-btn')){
        const inputtext = post.querySelector('.comment-text')
        console.log(inputtext)
        
        if (inputtext){
          
          console.log( {
              'comment_text' : inputtext.value
            });
            fetch(`http://127.0.0.1:8000/api/accounts/user/${post.id}/post/comment/`,{
              method: "POST",
              headers:  {
                "Authorization": "Bearer " + localStorage.getItem("access"),
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                'comment_text' : inputtext.value
              })
            }).then(res => res.json()).then(data => {
              if (data.code == "token_not_valid") {
                console.log(localStorage.getItem('refresh'));
                fetch("http://127.0.0.1:8000/api/token/refresh/", {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({ refresh: localStorage.getItem('refresh') })
                }).then(res => res.json()).then(data => {
                  localStorage.setItem('access', data.data.access)
                  likepost()
                  
                })
                
              } else {
                loadfeed()
              }
            })
            
          }
          
        }
      })
      

      

      
      
      
      
      
      
      
      
      const profileUpdate = `<div class="overlay">
        
        <div class="upload-modal">
          
          <h3>Update Profile Data</h3>
          
          <!-- Upload Area -->
          
          <label class="upload-area">
            
            <input id="fileinput" type="file" hidden>
            
            <div class="upload-content">
              <div class="icon">⬆</div>
              <p><span>Drag & Drop</span> or <b>Choose file</b> to upload</p>
              <small>Supported formats: JPG or PNG</small>
            </div>
            
          </label>
          
          
          <!-- Bio Field -->
          
          <div class="bio-section">
            
            <label>Bio</label>
            <textarea id="bioinput" placeholder="Write short bio..."></textarea>
            
          </div>
          
          
          <!-- Buttons -->
          
          <div class="modal-buttons">
        
            <button class="cancel-btn" onclick=removeOverlay()>Cancel</button>
            <button class="upload-btn" onclick=updateProfile()>Upload</button>
            
          </div>
          
        </div>
      </div>`
      profileUpdatebtn.addEventListener('click',()=>{
        document.getElementById('overlay').innerHTML += profileUpdate
      })
