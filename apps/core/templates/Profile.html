  <script>
    
    let usernameContainer = document.getElementById('username');
    let userBio = document.getElementById('user-bio');
    let followerCount = document.getElementById('follower-count');
    let followingCount = document.getElementById('following-count');
    let avatar = document.getElementById('avatar');
    let user_id = localStorage.getItem('user_id')
    
    
    fetch(`http://127.0.0.1:8000/api/accounts/profile/${user_id}/`)
    .then(res => res.json())
    .then(data => {
      console.log(data)
      usernameContainer.innerText = data['data']['username'];
      userBio.innerText = data['data']['bio'];
      followerCount.innerText = data['data']['follower'];
      followingCount.innerText = data['data']['following'];
      avatar.style.backgroundImage = `url(${data['data']['profile_pic']})`;
      avatar.style.backgroundSize = 'cover';
      
      for (let i = 0 ; data['data']['post'].length > i ; i++){
        const newpost = `<div class="post" style="background-image: url(${data['data']['post'][i]['post_img']}); background-size: cover;"></div>`;
        if (data['data']['post'][i]['post_img']!=null){
          
          document.getElementById('post-container').innerHTML += newpost;
        }
      }
    })

    const profileUpdate = `<div class="overlay">
      
      <div class="upload-modal">
        
        <h3>Update Profile Data</h3>
        
        <!-- Upload Area -->
        
        <label class="upload-area">
          
          <input id="fileinput" type="file" hidden>
          
          <div class="upload-content">
            <div class="icon">⬆</div>
            <p><span>Drag & Drop</span> or <b>Choose file</b> to upload</p>
            <small>Supported formats: JPG or PNG</small>
          </div>
          
      </label>
      
      
      <!-- Bio Field -->
      
      <div class="bio-section">
        
        <label>Bio</label>
        <textarea id="bioinput" placeholder="Write short bio..."></textarea>
        
      </div>
      
      
      <!-- Buttons -->
      
      <div class="modal-buttons">
        
        <button class="cancel-btn" onclick=removeOverlay()>Cancel</button>
        <button class="upload-btn" onclick=updateProfile()>Upload</button>
        
      </div>
      
    </div>
  </div>`
  
  
  profileUpdatebtn.addEventListener('click',()=>{
    document.getElementById('overlay').innerHTML += profileUpdate
  })
