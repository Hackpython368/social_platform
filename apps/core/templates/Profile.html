<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZentroConnect</title>
  {% load static %}
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static '/style/theme.css' %}">
  <link rel="stylesheet" href="{% static '/style/navbar.css' %}">
  <link rel="stylesheet" href="{% static '/style/createpoststyle.css' %}">
  <link rel="stylesheet" href="{% static '/style/Profile.css' %}">
</head>

<body>

  
  <div id="overlay"></div>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="navbar-balancer"></div>
    <div class="logo">ZentroConnect</div>
    <div class="settings-btn" id="settingsBtn">⚙

    </div>
    <div class="settings-dropdown" id="settingsMenu">
      <div class="settings-header">
  <span>Settings</span>
  <button class="close-btn" id="closeBtn">✕</button>
  </div>
      <div class="setting-item">

<span>Theme</span>

<label class="switch">
<input type="checkbox" id="themeToggle">
<span class="slider"></span>
</label>

</div>

<div class="menu-item" id="profileUpdatebtn">
Edit Profile
</div>

<div class="menu-item">
About
</div>


    </div>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <a href="/home">
      <div class="side-item">🏠 <span class="side-text">Home</span></div>
    </a>
    <a href="/search">
      <div class="side-item">🔍 <span class="side-text">Search</span></div>
    </a>
    <a href="#">
      <div class="side-item" id="openPostModal">➕ <span class="side-text">Create</span></div>
    </a>
    <a href="/profile">
      <div class="side-item">👤 <span class="side-text">Profile</span></div>
    </a>
  </div>

  <div class="bottom-nav-mobile">
    <a href="/home">🏠</a>
    <a href="/search">🔍</a>
    <a href="#" id="openPostModalMobile">➕</a>
    <a href="/profile">👤</a>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main">
    <div class="feed-container">

      <div class="profile-container">

        <div class="profile-header">
          <div class="avatar" id="avatar"></div>

          <div class="user-info" >
            <h1 id="username">Loading....</h1>
            <p id="user-bio">
              Loading....
            </p>
          </div>
        </div>

        <div class="stats">
          <div class="stat">
            <h2 id="follower-count">0</h2>
            <p>Follower</p>
          </div>

          <div class="stat">
            <h2 id="following-count">0</h2>
            <p>Following</p>
          </div>
        </div>

        <div class="posts-section">
          <h3>Your Post</h3>

          <div class="posts-grid" id="post-container">
          </div>
        </div>

      </div>

    </div>
  </div>
  <script src="{% static '/script/changeurl.js' %}"></script>
  <script>
    
    let usernameContainer = document.getElementById('username');
    let userBio = document.getElementById('user-bio');
    let followerCount = document.getElementById('follower-count');
    let followingCount = document.getElementById('following-count');
    let avatar = document.getElementById('avatar');
    let user_id = localStorage.getItem('user_id');
    
    
    fetch(`${url}/api/accounts/profile/${user_id}/`)
    .then(res => res.json())
    .then(data => {
      console.log(data)
      usernameContainer.innerText = data['data']['username'];
      userBio.innerText = data['data']['bio'];
      followerCount.innerText = data['data']['follower'];
      followingCount.innerText = data['data']['following'];
      avatar.style.backgroundImage = `url(${data['data']['profile_pic']})`;
      avatar.style.backgroundSize = 'cover';
      
      for (let i = 0 ; data['data']['post'].length > i ; i++){
        const newpost = `<div class="post" style="background-image: url(${data['data']['post'][i]['post_img']}); background-size: cover;"></div>`;
        if (data['data']['post'][i]['post_img']!=null){
          
          document.getElementById('post-container').innerHTML += newpost;
        }
      }
    })

    const profileUpdate = `<div class="overlay">
      
      <div class="upload-modal">
        
        <h3>Update Profile Data</h3>
        
        <!-- Upload Area -->
        
        <label class="upload-area">
          
          <input id="fileinput" type="file" hidden>
          
          <div class="upload-content">
            <div class="icon">⬆</div>
            <p><span>Drag & Drop</span> or <b>Choose file</b> to upload</p>
            <small>Supported formats: JPG or PNG</small>
          </div>
          
      </label>
      
      
      <!-- Bio Field -->
      
      <div class="bio-section">
        
        <label>Bio</label>
        <textarea id="bioinput" placeholder="Write short bio..."></textarea>
        
      </div>
      
      
      <!-- Buttons -->
      
      <div class="modal-buttons">
        
        <button class="cancel-btn" onclick=removeOverlay()>Cancel</button>
        <button class="upload-btn" onclick=updateProfile()>Upload</button>
        
      </div>
      
    </div>
  </div>`
  
  
  profileUpdatebtn.addEventListener('click',()=>{
    document.getElementById('overlay').innerHTML += profileUpdate
  })
  
  const removeOverlay = () => {
    console.log("removeOverlay")
    document.getElementById("overlay").innerHTML = ''
  }

</script>
<script src="{% static '/script/loadRefreshToken.js' %}"></script>
<script src="{% static '/script/createpost.js' %}"></script>

  <script src="{% static '/script/navsettings.js' %}"></script>

</body>

</html>
