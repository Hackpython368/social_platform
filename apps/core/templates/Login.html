<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZentroConnect - Desktop Login</title>
{% load static %}

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href='{% static "/style/login.css" %}'>
</head>

<body>

<div class="login-card">

  <div class="left">
    <div class="image-container"></div>
  </div>

  <div class="right">

    <img src="{% static '/static/src/img/logon-removebg-preview.png' %}" alt="Logo" class="logo">

    <div class="title">Login</div>

    <div class="input-group">
      <input type="email" placeholder="Email" id="email">
    </div>

    <div class="input-group">
      <input type="password" placeholder="Password" id="password">
    </div>

    <button id="submit">SUBMIT</button>

    <div class="divider"></div>

    <div class="footer">
      Don’t have an account? <a href="/register">Register</a>
    </div>

  </div>

</div>

<script>
  let getData = (jsondata) => {
    fetch('http://127.0.0.1:8000/api/token/',{
      method : "POST",
      headers : {
        "Content-Type": "application/json",
        "Authorization": "Bearer your_token_here",
        "Cache-Control": "no-cache",
        "Accept": "application/json",
        "User-Agent": "SocialApp/1.0"
      },
      body : JSON.stringify(jsondata) 
    }).then(res => res.json()).then(data =>{
      if(data['success']){
        const token = localStorage.setItem("access",data.data.access);
        const refresh_token = localStorage.setItem("refresh",data.data.refresh);
        localStorage.setItem("user_id",data.data.user.id);
        localStorage.setItem("theme","light");
        window.location.href = "http://127.0.0.1:8000/home/";   
      }else{
        alert("Your entered Email and Password is wrong !")
      }
    })
  }
  let loginbtn = document.getElementById('submit')

  document.addEventListener('keydown',(event)=>{
    if (event.key=="enter"){
        const jsondata = {
      'email' : document.getElementById('email').value,
      'password': document.getElementById('password').value
    }
    
        document.getElementById('email').value = ""
        document.getElementById('password').value = ""
        getData(jsondata)
    }
  })
  
  loginbtn.addEventListener('click',() => {
    const jsondata = {
      'email' : document.getElementById('email').value,
      'password': document.getElementById('password').value
    }
    document.getElementById('email').value = ""
    document.getElementById('password').value = ""

    getData(jsondata)
  })

</script>

</body>
</html>
